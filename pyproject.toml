[project]
name = "dircleaner"
version = "0.1.0"
description = "A dir cleaner with auto-extract and dir organizer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pathlib>=1.0.1",
    "rarfile>=4.2",
    "watchdog>=6.0.0",
]
[project.scripts]
dircleaner = "src.main:main"

[tool.setuptools]
packages = ["src"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
